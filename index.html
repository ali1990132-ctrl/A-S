<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A&S TV — تطبيقات A&S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --bg:#070b16; --card:#0e1526; --line:#1c2a45; --text:#eaf2ff; --muted:#8fa3c4;
    --blue:#1e7bff; --cyan:#19d3e6; --grad:linear-gradient(135deg,#1e7bff,#19d3e6);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#0d2a5a55,transparent),var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:18px 14px 50px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px}
  .brand-logo{width:76px;height:76px;border-radius:50%;object-fit:cover;box-shadow:0 0 22px #19d3e655;border:2px solid #1e7bff88}
  .brand h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.5px}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:15px}
  .actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
  .pill{border:1px solid var(--line);background:#0a1120;color:var(--text);border-radius:999px;padding:8px 16px;font:600 14px Cairo;cursor:pointer}
  .pill.on{background:var(--grad);border-color:transparent;box-shadow:0 4px 16px #1e7bff66}
  nav{display:flex;gap:6px;margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px}
  nav button{flex:1;border:0;background:transparent;color:var(--muted);font:700 16px Cairo;padding:11px 6px;border-radius:13px;cursor:pointer}
  nav button.on{background:var(--grad);color:#fff;box-shadow:0 4px 16px #1e7bff55}
  .hint{color:var(--muted);margin:16px 4px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .num{position:absolute;top:10px;inset-inline-start:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#0a1120;display:grid;place-items:center;font-weight:800;font-size:14px;z-index:1}
  .card a.img{display:block;padding:14px;text-decoration:none}
  .card .icon{width:100%;aspect-ratio:1;border-radius:22px;object-fit:cover;background:#050912;display:block}
  .card .bar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:#0b1220}
  .card .name{font-weight:800;font-size:15px;direction:ltr}
  .ver{color:var(--muted);font-size:12px;direction:ltr;text-align:start}
  .tag{font-size:11px;color:#fff;background:#ff4d6d;border-radius:8px;padding:2px 8px;margin-top:2px;display:inline-block}
  .soon{opacity:.55}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
  .row img{width:52px;height:52px;border-radius:12px;object-fit:cover}
  .row .t{flex:1;min-width:0}
  .row .t b{display:block;direction:ltr;text-align:right}
  .row .t span{color:var(--muted);font-size:13px;word-break:break-all;direction:ltr;display:block;text-align:right}
  .code{font:800 26px/1 monospace;color:var(--cyan);letter-spacing:2px}
  .qr{background:#fff;border-radius:14px;padding:10px;display:grid;place-items:center;margin:14px}
  .qr svg,.qr img{width:100%;height:auto}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 12px 14px;position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
  .tile .num{top:10px}
  .tile .mini{width:56px;height:56px;border-radius:14px;object-fit:cover;box-shadow:0 2px 10px #0008}
  .tile .tname{font-weight:800;font-size:16px;color:#c8d6ee;direction:ltr}
  .tile .big{font:800 22px/1.2 Cairo,monospace;color:var(--cyan);direction:ltr;word-break:break-all}
  .tile .big.sm{font-size:15px}
  .tile a.big{font-size:15px;white-space:nowrap}
  .tile .btns{display:flex;gap:8px;width:100%}
  .tile .btns .pill{flex:1;padding:9px 6px}
  .tile .qrbox{background:#fff;border-radius:16px;padding:10px;width:78%}
  .tile .qrbox svg{width:100%;height:auto;display:block}
  .tile .muted{color:var(--muted);font-size:14px}
  .tile.soon{opacity:.55}
  .sheet-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
  .sheet{width:100%;max-width:440px;background:#1c1c1e;border-radius:22px;padding:18px 18px 20px;box-shadow:0 20px 60px #000c;position:relative;animation:pop .18s ease-out}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
  .sheet .x{position:absolute;top:12px;inset-inline-end:14px;background:none;border:0;color:#aaa;font-size:30px;line-height:1;cursor:pointer}
  .sheet .top{display:flex;align-items:center;gap:14px;margin:6px 0 22px}
  .sheet .fic{width:72px;height:72px;border-radius:16px;background:#3a3a3c;display:grid;place-items:center;flex-shrink:0}
  .sheet .fn{font-size:19px;font-weight:600;direction:ltr;text-align:start;word-break:break-all}
  .sheet .fs{color:#9a9a9f;font-size:14px;margin-top:4px}
  .sheet .dl{display:block;text-align:center;background:#3d7cff;color:#fff;font:700 18px Cairo;padding:14px;border-radius:999px;text-decoration:none}
  .sheet .note{color:#8e8e93;font-size:12px;text-align:center;margin-top:10px}
  footer a{color:var(--text);font-weight:800;text-decoration:none;display:inline-block;margin-bottom:6px}
  footer{margin-top:28px;text-align:center;color:var(--muted);font-size:14px}
  footer b{color:var(--text)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--grad);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  [hidden]{display:none!important}
</style>
</head>

let lang = "ar";
try{ lang = localStorage.getItem("as_lang") || "ar"; }catch(e){}
const T = (ar,en)=> lang==="ar"?ar:en;
const digits = n => lang==="ar" ? String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]) : String(n);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const shareTxt = a => a.code ? `${a.name} — Downloader: ${a.code}\nhttp://aftv.news/${a.code}` : `${a.name}\n${a.url}`;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast(T("تم النسخ ✓","Copied ✓")); }
  catch(e){ toast(T("انسخ يدوياً","Copy manually")); }
}

function render(){
  document.documentElement.lang = lang; document.documentElement.dir = lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-ar]").forEach(el=>el.textContent = el.dataset[lang]);
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));

  document.getElementById("appsGrid").innerHTML = APPS.map((a,i)=>{
    const ready = !!a.url;
    const tag = !ready ? `<span class="tag">${T("قريباً","Soon")}</span>` : (a.tag?`<span class="tag">${esc(a.tag)}</span>`:"");
    return `<div class="card ${ready?"":"soon"}">
      <div class="num">${digits(i+1)}</div>
      <a class="img" ${ready?`href="#" data-app="${i}"`:""}><img class="icon" src="${ICON}" alt=""></a>
      <div class="bar"><div><div class="name">${esc(a.name)}</div>${a.ver?`<div class="ver">v${esc(a.ver)}</div>`:""}${tag}</div>
        ${ready?`<button class="pill" data-copy="${esc(shareTxt(a))}">${T("مشاركة","Share")}</button>`:""}
      </div></div>`;
  }).join("");

  const tile = (a,i,inner)=>`<div class="tile ${inner.soon?"soon":""}">
      <div class="num">${digits(i+1)}</div>
      <img class="mini" src="${ICON}" alt="">
      <div class="tname">${esc(a.name)}</div>${inner.html}</div>`;
  const soonHtml = `<div class="muted">${T("قريباً","Coming soon")}</div>`;

  document.getElementById("codesList").innerHTML = APPS.map((a,i)=> a.code
    ? tile(a,i,{html:`<div class="big">${esc(a.code)}</div>
        <div class="btns"><button class="pill" data-copy="${esc(a.code)}">${T("نسخ","Copy")}</button>
        <button class="pill" data-copy="${esc(shareTxt(a))}">${T("مشاركة","Share")}</button></div>`})
    : tile(a,i,{soon:true,html:soonHtml})).join("");

  document.getElementById("linksList").innerHTML = APPS.map((a,i)=>{
    if(!a.code && !a.url) return tile(a,i,{soon:true,html:soonHtml});
    const link = a.code ? `http://aftv.news/${a.code}` : a.url;
    const label = a.code ? `aftv.news/${a.code}` : T("رابط مباشر","Direct link");
    return tile(a,i,{html:`<a class="big ${a.code?"":"sm"}" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(label)}</a>
        <div class="btns"><button class="pill" data-copy="${esc(link)}">${T("نسخ","Copy")}</button>
        <button class="pill" data-copy="${esc(shareTxt(a))}">${T("مشاركة","Share")}</button></div>`});
  }).join("");

  document.getElementById("qrGrid").innerHTML = APPS.map((a,i)=>{
    if(!a.url) return tile(a,i,{soon:true,html:soonHtml});
    let svg="";
    try{ if(QR_PRE[a.url]) svg=QR_PRE[a.url]; else { const q=qrcode(0,"M"); q.addData(a.url); q.make(); svg=q.createSvgTag({cellSize:4,margin:1,scalable:true}); } }
    catch(e){ svg=`<div style="color:#000;padding:16px">${T("تعذر إنشاء الباركود","QR unavailable")}</div>`; }
    return tile(a,i,{html:`<div class="qrbox">${svg}</div><div class="muted">${T("امسح للتحميل","Scan to download")}</div>
        <div class="btns"><button class="pill" data-copy="${esc(shareTxt(a))}">${T("مشاركة","Share")}</button></div>`});
  }).join("");

  document.getElementById("tgWrap").innerHTML = TELEGRAM ? `<a href="${esc(TELEGRAM)}" target="_blank" rel="noopener">${T("تحديثات تيليجرام","Telegram updates")}</a>` : "";
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  ["apps","codes","links","qr"].forEach(id=>document.getElementById(id).hidden = id!==b.dataset.tab);
});
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{
  lang=b.dataset.lang; try{localStorage.setItem("as_lang",lang)}catch(e){} render();
});
function fileName(u){ try{ return decodeURIComponent(u.split("?")[0].split("/").pop()) || "app.apk"; }catch(e){ return "app.apk"; } }
function openSheet(a){
  document.getElementById("sheetName").textContent = fileName(a.url);
  document.getElementById("sheetSize").textContent = a.size ? (lang==="ar" ? digits(a.size).replace(".","٫")+" م.ب" : a.size+" MB") : a.name;
  document.getElementById("sheetVer").textContent = a.ver ? T("الإصدار ","Version ")+a.ver : "";
  const dl=document.getElementById("sheetDl"); dl.href=a.url; dl.textContent=T("تنزيل آمن","Safe download");
  document.getElementById("sheetNote").textContent=T("بعد التنزيل افتح الملف واضغط تثبيت","After downloading, open the file and tap Install");
  document.getElementById("sheet").hidden=false;
}
function closeSheet(){ document.getElementById("sheet").hidden=true; }
document.getElementById("sheetX").onclick=closeSheet;
document.getElementById("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") closeSheet(); });
document.getElementById("sheetDl").addEventListener("click",()=>setTimeout(closeSheet,400));
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
document.addEventListener("click",e=>{const c=e.target.closest("[data-app]"); if(c){ e.preventDefault(); openSheet(APPS[+c.dataset.app]); return; }});
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]"); if(b) copy(b.dataset.copy);});
document.getElementById("shareBtn").onclick=()=>copy(location.href.split("#")[0]);
render();
</script>
</body>
</html>
